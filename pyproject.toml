[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adaptsg"
version = "0.1.0"
description = "Constraint-aware journey planning and minimal safe replanning for caregivers in Singapore."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "AdaptSG Hackathon Team" }]
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.3,<2",
  "mangum>=0.19,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.42,<2",
]
dev = [
  "bandit[toml]>=1.8,<2",
  "mypy>=1.14,<3",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptsg"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "api"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=adaptsg --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: uses optional network or cloud services",
]

[tool.coverage.run]
branch = true
source = ["adaptsg"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

