AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AdaptSG authenticated production API with Cognito, cost-bounded Lambda, durable journey state, and evidence storage.

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
    AllowedValues: [demo, staging, production]
  ApplicationMode:
    Type: String
    Default: demo
    AllowedValues: [demo, live]
    Description: Demo is deterministic and makes no Bedrock or live-provider calls.
  AllowedCorsOrigin:
    Type: String
    Default: http://localhost:8501
    AllowedPattern: ^https?://[^*]+$
    Description: Exact trusted browser origin; wildcards are rejected.
  ProviderSecretName:
    Type: String
    Default: ""
    Description: Optional Secrets Manager name with OneMap, LTA, and data.gov.sg JSON keys.
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  BedrockModelArns:
    Type: CommaDelimitedList
    Default: DISABLED
    Description: DISABLED prevents inference; otherwise pass only the exact model/profile ARNs.
  EnablePointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  LambdaReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: -1
    Description: Set to -1 to omit reserved concurrency in quota-constrained accounts.
  UserPoolDomainPrefix:
    Type: String
  AuditRetentionDays:
    Type: Number
    MinValue: 1
  RevokedConsentRetentionDays:
    Type: Number
    MinValue: 1
  ConsentPolicyVersion:
    Type: String
    MinLength: 1
  CatalogVersion:
    Type: String
    MinLength: 1
  CostModelVersion:
    Type: String
    MinLength: 1
  OneMapApiTokenParameter:
    Type: AWS::SSM::Parameter::Value<String>
    NoEcho: true
  LtaAccountKeyParameter:
    Type: AWS::SSM::Parameter::Value<String>
    NoEcho: true

Conditions:
  HasProviderSecret: !Not [!Equals [!Ref ProviderSecretName, ""]]
  BedrockInferenceEnabled: !Not
    - !Equals [!Join ["", !Ref BedrockModelArns], DISABLED]
  PointInTimeRecoveryEnabled: !Equals [!Ref EnablePointInTimeRecovery, "true"]
  HasLambdaReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        ADAPTSG_MODE: live
        ADAPTSG_AUTHENTICATION_MODE: cognito
        ADAPTSG_AUTHENTICATION_CONFIGURED: "true"
        ADAPTSG_ENCRYPTION_CONFIGURED: "true"
        ADAPTSG_AUDIT_STORAGE_CONFIGURED: "true"
        ADAPTSG_PRODUCTION_RETENTION_CONFIGURED: "true"
        ADAPTSG_LIVE_CATALOG_CONFIGURED: "true"
        ADAPTSG_JOURNEYS_TABLE: !Ref JourneyTable
        ADAPTSG_AUDIT_RETENTION_DAYS: !Ref AuditRetentionDays
        ADAPTSG_REVOKED_CONSENT_RETENTION_DAYS: !Ref RevokedConsentRetentionDays
        ADAPTSG_CONSENT_POLICY_VERSION: !Ref ConsentPolicyVersion
        ADAPTSG_CATALOG_VERSION: !Ref CatalogVersion
        ADAPTSG_COST_MODEL_VERSION: !Ref CostModelVersion
        AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ONEMAP_API_TOKEN: !Ref OneMapApiTokenParameter
        LTA_ACCOUNT_KEY: !Ref LtaAccountKeyParameter
        DATA_GOV_SG_API_KEY: !If
          - HasProviderSecret
          - !Sub "{{resolve:secretsmanager:${ProviderSecretName}:SecretString:DATA_GOV_SG_API_KEY}}"
          - ""

Resources:
  CaregiverUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-caregivers
      UsernameAttributes: [email]
      MfaConfiguration: OPTIONAL
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  CaregiverUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CaregiverUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - !Sub ${AdaptSgResourceServer}/journeys.read
        - !Sub ${AdaptSgResourceServer}/journeys.write
        - !Sub ${AdaptSgResourceServer}/consents.manage
        - !Sub ${AdaptSgResourceServer}/audit.read
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [https://production.invalid/auth/callback]
      LogoutURLs: [https://production.invalid/logout]

  AdaptSgResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: adaptsg
      Name: AdaptSG production API scopes
      UserPoolId: !Ref CaregiverUserPool
      Scopes:
        - ScopeName: journeys.read
          ScopeDescription: Read owned journeys
        - ScopeName: journeys.write
          ScopeDescription: Create and mutate owned journeys
        - ScopeName: consents.manage
          ScopeDescription: Manage journey-planning consent
        - ScopeName: audit.read
          ScopeDescription: Read owned audit events

  CaregiverUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref UserPoolDomainPrefix
      UserPoolId: !Ref CaregiverUserPool

  JourneyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PointInTimeRecoveryEnabled, true, false]
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      DeletionProtectionEnabled: true
      Tags:
        - Key: adaptsg-schema-version
          Value: "1"
        - Key: Application
          Value: AdaptSG
        - Key: Environment
          Value: !Ref EnvironmentName

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::Region}-${AWS::StackName}-evidence"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryEvaluationArtifacts
            Status: Enabled
            Prefix: temporary/
            ExpirationInDays: 14
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: AdaptSG
        - Key: Environment
          Value: !Ref EnvironmentName

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AdaptSgLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: AdaptSG
        - Key: Environment
          Value: !Ref EnvironmentName

  AdaptSgHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CaregiverUserPool}
              audience:
                - !Ref CaregiverUserPoolClient
      CorsConfiguration:
        AllowOrigins: [https://production.invalid]
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST]

  AdaptSgFunction:
    Type: AWS::Serverless::Function
    DependsOn: AdaptSgLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: ../..
      Handler: adaptsg.aws_handler.handler
      Description: AdaptSG caregiver-owned planning API.
      ReservedConcurrentExecutions: !If
        - HasLambdaReservedConcurrency
        - !Ref LambdaReservedConcurrency
        - !Ref AWS::NoValue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JourneyTable
        - Statement:
            - Sid: InvokeConfiguredBedrockModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*
            - Sid: ReadConfiguredProviderSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdaptSgHttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdaptSgHttpApi
            Path: /{proxy+}
            Method: ANY
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: BUFFERED
        Cors:
          AllowCredentials: false
          AllowOrigins: [!Ref AllowedCorsOrigin]
          AllowMethods: [GET, POST]
          AllowHeaders:
            - authorization
            - content-type
            - idempotency-key
            - x-amz-content-sha256
            - x-amz-date
            - x-amz-security-token
          MaxAge: 300

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdaptSgFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: AdaptSG reached its reserved-concurrency cost boundary.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdaptSgFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AdaptSgDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-operations"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "region": "${AWS::Region}",
                "title": "Requests, errors, and throttles",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AdaptSgFunction}"],
                  [".", "Errors", ".", "."],
                  [".", "Throttles", ".", "."]
                ]
              }
            }
          ]
        }

Outputs:
  AdaptSgHttpApiUrl:
    Description: Authenticated production HTTP API URL.
    Value: !Sub https://${AdaptSgHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  CognitoIssuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CaregiverUserPool}
  CognitoClientId:
    Value: !Ref CaregiverUserPoolClient
  JourneyTableName:
    Value: !Ref JourneyTable
  AdaptSgFunctionName:
    Description: Lambda function name used by the deployment smoke test.
    Value: !Ref AdaptSgFunction
  AdaptSgFunctionUrl:
    Description: IAM-authenticated URL; callers must sign requests with SigV4.
    Value: !GetAtt AdaptSgFunctionUrl.FunctionUrl
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  DashboardName:
    Value: !Ref AdaptSgDashboard
  BedrockStatus:
    Description: DISABLED means the Lambda role cannot invoke Bedrock or consume model tokens.
    Value: !If [BedrockInferenceEnabled, CONNECTED, DISABLED]
