apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - persistent-volume-claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: adaptsg
      app.kubernetes.io/instance: adaptsg-dev
      app.kubernetes.io/part-of: adaptsg
      app.kubernetes.io/managed-by: argocd
      environment: development
