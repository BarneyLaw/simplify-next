apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adaptsg-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BarneyLaw/simplify-next.git
    targetRevision: main
    path: infra/kubernetes/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - PruneLast=true
