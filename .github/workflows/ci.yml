name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Static analysis, security, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.2"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy
      - name: Unit and scenario tests
        run: python -m pytest
      - name: Security lint
        run: python -m bandit -q -r src api streamlit_app.py
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: Vercel configuration syntax
        run: python -m json.tool vercel.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: correctness
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: adaptsg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sam:
    name: AWS SAM validates and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: correctness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
      - name: Validate template
        run: sam validate --lint --template-file infra/aws/template.yaml
      - name: Validate deployment bootstrap
        run: sam validate --lint --template-file infra/aws/bootstrap.yaml
      - name: Build Lambda artifact
        run: sam build --template-file infra/aws/template.yaml

  deploy-aws:
    name: Deploy AWS demo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [correctness, docker, sam]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
      ADAPTSG_STACK_NAME: ${{ vars.ADAPTSG_STACK_NAME || 'adaptsg-demo' }}
      ADAPTSG_ALLOWED_CORS_ORIGIN: ${{ vars.ADAPTSG_ALLOWED_CORS_ORIGIN || 'http://localhost:8501' }}
      ADAPTSG_COGNITO_CALLBACK_URL: ${{ vars.ADAPTSG_COGNITO_CALLBACK_URL || vars.ADAPTSG_ALLOWED_CORS_ORIGIN || 'http://localhost:8501' }}
      ADAPTSG_COGNITO_LOGOUT_URL: ${{ vars.ADAPTSG_COGNITO_LOGOUT_URL || vars.ADAPTSG_ALLOWED_CORS_ORIGIN || 'http://localhost:8501' }}
      ADAPTSG_PROVIDER_SECRET_NAME: ${{ vars.ADAPTSG_PROVIDER_SECRET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Download correctness evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: deployment-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
      - name: Verify required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ACCOUNT_ID:?Set the AWS_ACCOUNT_ID environment variable}"
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN}"
          : "${AWS_CLOUDFORMATION_ROLE_ARN:?Set AWS_CLOUDFORMATION_ROLE_ARN}"
          : "${AWS_SAM_ARTIFACT_BUCKET:?Set AWS_SAM_ARTIFACT_BUCKET}"
      - name: Assume short-lived AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: AdaptSG-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Verify assumed AWS identity
        run: |
          aws sts get-caller-identity
      - name: Build and deploy the token-free authenticated demo stack
        shell: bash
        run: |
          set -euo pipefail
          sam build --template-file infra/aws/template.yaml
          deploy_stack() {
            local allowed_origin="$1"
            local callback_url="$2"
            local logout_url="$3"
            local parameters=(
              "EnvironmentName=demo"
              "ApplicationMode=demo"
              "AllowedCorsOrigin=${allowed_origin}"
              "CognitoCallbackUrl=${callback_url}"
              "CognitoLogoutUrl=${logout_url}"
              "EnableSelfSignUp=true"
              "BedrockModelArns=DISABLED"
              "EnablePointInTimeRecovery=false"
              "EnableDeletionProtection=false"
              "LambdaReservedConcurrency=-1"
            )
            if [[ -n "${ADAPTSG_PROVIDER_SECRET_NAME}" ]]; then
              parameters+=("ProviderSecretName=${ADAPTSG_PROVIDER_SECRET_NAME}")
            fi
            sam deploy \
              --template-file .aws-sam/build/template.yaml \
              --stack-name "${ADAPTSG_STACK_NAME}" \
              --region "${AWS_REGION}" \
              --s3-bucket "${AWS_SAM_ARTIFACT_BUCKET}" \
              --s3-prefix "deployments/${GITHUB_SHA}" \
              --role-arn "${AWS_CLOUDFORMATION_ROLE_ARN}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --parameter-overrides "${parameters[@]}" \
              --tags Application=AdaptSG Environment=demo
          }

          # CloudFront assigns its hostname during the first deployment. The
          # second pass makes that exact origin the API CORS and OAuth target.
          deploy_stack \
            "${ADAPTSG_ALLOWED_CORS_ORIGIN}" \
            "${ADAPTSG_COGNITO_CALLBACK_URL}" \
            "${ADAPTSG_COGNITO_LOGOUT_URL}"
          web_app_url=$(aws cloudformation describe-stacks \
            --stack-name "${ADAPTSG_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebAppUrl'].OutputValue" \
            --output text)
          deploy_stack "${web_app_url}" "${web_app_url}/" "${web_app_url}/"
      - name: Smoke-test Lambda and DynamoDB without Bedrock
        shell: bash
        env:
          IDEMPOTENCY_KEY: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stacks \
            --stack-name "${ADAPTSG_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='AdaptSgFunctionName'].OutputValue" \
            --output text)
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = {
              "prompt": (
                  "Plan 10 am-5 pm from Toa Payoh for a wheelchair user, "
                  "400 m maximum walking, lunch by 1 pm, budget $70."
              ),
              "journey_date": "2026-09-01",
          }
          event = {
              "version": "2.0",
              "routeKey": "$default",
              "rawPath": "/api/journeys",
              "rawQueryString": "",
              "headers": {
                  "content-type": "application/json",
                  "idempotency-key": os.environ["IDEMPOTENCY_KEY"],
              },
              "requestContext": {
                  "domainName": "lambda",
                  "http": {
                      "method": "POST",
                      "path": "/api/journeys",
                      "protocol": "HTTP/1.1",
                      "sourceIp": "127.0.0.1",
                      "userAgent": "github-actions",
                  },
                  "requestId": "github-actions",
                  "stage": "$default",
                  "time": "01/Jan/2026:00:00:00 +0000",
                  "timeEpoch": 0,
              },
              "body": json.dumps(body),
              "isBase64Encoded": False,
          }
          Path("smoke-event.json").write_text(json.dumps(event), encoding="utf-8")
          PY
          aws lambda invoke \
            --function-name "${function_name}" \
            --cli-binary-format raw-in-base64-out \
            --payload file://smoke-event.json \
            smoke-response.json
          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("smoke-response.json").read_text(encoding="utf-8"))
          assert response["statusCode"] == 200, response
          journey = json.loads(response["body"])
          assert journey["status"] == "draft", journey
          assert journey["token_usage"] == {"input_tokens": 0, "output_tokens": 0}, journey
          print("Lambda/DynamoDB smoke test passed; Bedrock token usage is zero.")
          PY
      - name: Verify public health and protected user routes
        shell: bash
        run: |
          set -euo pipefail
          api_url=$(aws cloudformation describe-stacks \
            --stack-name "${ADAPTSG_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='AdaptSgHttpApiUrl'].OutputValue" \
            --output text)
          health_status=$(curl --silent --show-error --output health-response.json \
            --write-out '%{http_code}' "${api_url}/api/health")
          [[ "${health_status}" == "200" ]]
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("health-response.json").read_text(encoding="utf-8"))
          assert health == {"status": "ok", "mode": "demo", "storage": "dynamodb"}, health
          PY
          protected_status=$(curl --silent --show-error --output protected-response.json \
            --write-out '%{http_code}' \
            "${api_url}/api/journeys/00000000-0000-0000-0000-000000000000")
          [[ "${protected_status}" == "401" ]]
          echo "API Gateway health passed and the user route rejected an unsigned request."
      - name: Publish versioned catalog and evaluation evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_bucket=$(aws cloudformation describe-stacks \
            --stack-name "${ADAPTSG_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='EvidenceBucketName'].OutputValue" \
            --output text)
          aws s3 cp src/adaptsg/data/venues.json \
            "s3://${evidence_bucket}/catalog/venues.json" \
            --sse AES256
          aws s3 cp deployment-evidence/coverage.xml \
            "s3://${evidence_bucket}/evals/${GITHUB_SHA}/coverage.xml" \
            --sse AES256
          aws s3api head-object \
            --bucket "${evidence_bucket}" \
            --key "evals/${GITHUB_SHA}/coverage.xml"
      - name: Publish static web app and public runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "${ADAPTSG_STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          export ADAPTSG_WEB_APP_URL=$(stack_output WebAppUrl)
          export ADAPTSG_WEB_BUCKET=$(stack_output WebBucketName)
          export ADAPTSG_WEB_DISTRIBUTION_ID=$(stack_output WebDistributionId)
          export ADAPTSG_COGNITO_DOMAIN=$(stack_output CognitoDomain)
          export ADAPTSG_COGNITO_CLIENT_ID=$(stack_output CognitoClientId)
          web_source=infra/aws/web
          if [[ -f public/index.html ]]; then
            web_source=public
          fi
          aws s3 sync "${web_source}/" "s3://${ADAPTSG_WEB_BUCKET}/" \
            --delete \
            --sse AES256 \
            --cache-control "no-cache"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          web_url = os.environ["ADAPTSG_WEB_APP_URL"]
          domain = os.environ["ADAPTSG_COGNITO_DOMAIN"]
          config = {
              "schemaVersion": 1,
              "apiBaseUrl": "/api",
              "auth": {
                  "authorizationEndpoint": f"{domain}/oauth2/authorize",
                  "clientId": os.environ["ADAPTSG_COGNITO_CLIENT_ID"],
                  "logoutEndpoint": f"{domain}/logout",
                  "signInEndpoint": f"{domain}/login",
                  "signUpEndpoint": f"{domain}/signup",
                  "redirectUri": f"{web_url}/",
                  "logoutUri": f"{web_url}/",
                  "responseType": "code",
                  "pkceRequired": True,
                  "scopes": [
                      "openid",
                      "email",
                      "adaptsg/journeys.read",
                      "adaptsg/journeys.write",
                      "adaptsg/consents.manage",
                      "adaptsg/audit.read",
                  ],
                  "selfSignUpEnabled": True,
                  "tokenEndpoint": f"{domain}/oauth2/token",
              },
          }
          Path("runtime-config.json").write_text(
              json.dumps(config, separators=(",", ":")), encoding="utf-8"
          )
          PY
          aws s3 cp runtime-config.json \
            "s3://${ADAPTSG_WEB_BUCKET}/runtime-config.json" \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --sse AES256
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${ADAPTSG_WEB_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${ADAPTSG_WEB_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"
      - name: Verify the public AWS web URL and same-origin API
        shell: bash
        run: |
          set -euo pipefail
          web_app_url=$(aws cloudformation describe-stacks \
            --stack-name "${ADAPTSG_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebAppUrl'].OutputValue" \
            --output text)
          curl --fail --silent --show-error "${web_app_url}/" --output web-index.html
          curl --fail --silent --show-error "${web_app_url}/runtime-config.json" \
            --output deployed-runtime-config.json
          curl --fail --silent --show-error "${web_app_url}/api/health" \
            --output web-health-response.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("deployed-runtime-config.json").read_text(encoding="utf-8"))
          health = json.loads(Path("web-health-response.json").read_text(encoding="utf-8"))
          assert config["apiBaseUrl"] == "/api", config
          assert config["auth"]["pkceRequired"] is True, config
          assert config["auth"]["selfSignUpEnabled"] is True, config
          assert config["auth"]["signUpEndpoint"].endswith("/signup"), config
          assert health == {"status": "ok", "mode": "demo", "storage": "dynamodb"}, health
          assert Path("web-index.html").stat().st_size > 0
          print("CloudFront web, runtime auth configuration, and same-origin API passed.")
          PY
      - name: Record deployed resources
        shell: bash
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${ADAPTSG_STACK_NAME}" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table >> "${GITHUB_STEP_SUMMARY}"
